<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Flashcards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 320px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            border-radius: 16px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            color: var(--tg-theme-button-color, #007aff);
        }

        .controls {
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front" id="word-front">Persistent</div>
            <div class="card-face card-back" id="word-back">Matonatli / Qat'iy</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="nextWord()">Keyingi so'z ➔</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const words = [
            { en: "Persistent", uz: "Matonatli / Qat'iy" },
            { en: "Ambiguous", uz: "Ikki ma'noli / Tushunarsiz" },
            { en: "Meticulous", uz: "Tafsilotlarga e'tiborli" },
            { en: "Resilient", uz: "Chidamli / Bardoshli" }
        ];

        let currentIndex = 0;

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextWord() {
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % words.length;
                document.getElementById('word-front').innerText = words[currentIndex].en;
                document.getElementById('word-back').innerText = words[currentIndex].uz;
            }, 200);
        }
    </script>
</body>
</html>
